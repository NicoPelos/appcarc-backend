name: Revisión y actualización del manual

on:
  schedule:
    - cron: '45 6 * * *'  # 3:45am ARG (UTC-3) = 6:45am UTC — offset de la revisión de código
  workflow_dispatch:

jobs:
  select-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      scope: ${{ steps.select.outputs.scope }}
      scope_name: ${{ steps.select.outputs.scope_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Elegir qué página del manual le toca hoy
        id: select
        run: |
          set -euo pipefail
          mapfile -t MODULES < <(find mkdocs-manual/docs -maxdepth 1 -name '*.md' -printf '%p\n' | sort)
          COUNT=${#MODULES[@]}
          DOY=$((10#$(date -u +%j)))
          IDX=$(( DOY % COUNT ))
          SELECTED="${MODULES[$IDX]}"
          echo "scope=$SELECTED" >> "$GITHUB_OUTPUT"
          echo "scope_name=$(basename "$SELECTED" .md)" >> "$GITHUB_OUTPUT"
          echo "Página elegida: $SELECTED"

  review:
    needs: select-scope
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - name: Checkout appcarc-backend (acá vive el manual, se commitea/pushea acá)
        uses: actions/checkout@v4
        with:
          path: appcarc-backend

      - name: Checkout appCARC-mobile (solo lectura, fuente de verdad de la app)
        uses: actions/checkout@v4
        with:
          repository: NicoPelos/appCARC-mobile
          token: ${{ secrets.MOBILE_REPO_READ_TOKEN }}
          path: appcarc-mobile

      - name: Revisión y actualización del manual con Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 50
            --allowedTools "Read,Grep,Glob,Bash(git -C appcarc-backend log:*),Bash(git -C appcarc-backend diff:*),Bash(git -C appcarc-backend add:*),Bash(git -C appcarc-backend commit:*),Bash(git -C appcarc-backend push:*),Bash(git -C appcarc-backend config:*),Bash(git -C appcarc-mobile log:*),Bash(git -C appcarc-mobile diff:*),Bash(git -C appcarc-mobile show:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue close:*),Edit"
          prompt: |
            Estás parado en un working directory con DOS checkouts hermanos:
            - ./appcarc-backend  → acá vive el manual de usuario (mkdocs-manual/docs/). Es el único repo
              donde vas a escribir, commitear y pushear.
            - ./appcarc-mobile   → repo de la app mobile (Expo/React Native), SOLO LECTURA. Es la fuente
              de verdad de cómo funciona la app hoy — nunca lo edites, nunca lo commitees.

            REPO: ${{ github.repository }}
            PÁGINA DEL MANUAL A REVISAR (exclusivamente — no toques ninguna otra página, ni código de la
            app, ni las imágenes de assets/screenshots/):
            ./appcarc-backend/${{ needs.select-scope.outputs.scope }}

            Contexto: appClub es un sistema de gestión para clubes de montaña, con un backend (este repo)
            y una app mobile (appcarc-mobile). El manual (mkdocs-manual/docs/) es una guía paso a paso por
            rol (admin, secretaría, socio, profesor, palestrero) con instrucciones de texto + capturas de
            pantalla embebidas (`![...](assets/screenshots/...)`).

            ## Antes de arrancar

            Corré `gh issue list --repo ${{ github.repository }} --label manual-review --state open` y
            leé los que toquen esta página — no dupliques un hallazgo ya reportado.

            ## Tu tarea

            1. Leé la página del manual asignada completa y hacé una lista mental de los flujos que
               describe (ej. "Registrar cobro", "Inscribir a escuelita").
            2. Procesá los flujos **de a uno, por orden, terminando cada uno antes de pasar al
               siguiente** — no dejes la investigación de todos los flujos para el final:
               a. Buscá en `./appcarc-mobile/src/` la pantalla real correspondiente al flujo y comparala
                  contra el texto del manual: pasos que ya no existen, campos que cambiaron de nombre o
                  de mecánica (ej. un TextInput que ahora es una lista de checkboxes), botones que se
                  movieron o se renombraron, funcionalidad nueva que no está documentada.
               b. Si encontrás una desactualización de TEXTO, corregila vos mismo en el archivo `.md` con
                  la tool Edit — el texto tiene que describir fielmente lo que un usuario ve y hace hoy
                  en la app. No inventes funcionalidad que no exista; si tenés dudas sobre el
                  comportamiento exacto, leé el código de la pantalla con más detalle antes de escribir.
               c. Si notás que una **captura de pantalla** (`assets/screenshots/*.png`) quedó
                  desactualizada respecto al texto/flujo real (ej. muestra un campo que ya no existe), NO
                  la toques ni intentes regenerarla — nombrala en el issue para que se regenere a mano en
                  otra sesión (hay un proceso manual aparte para eso).
               d. Si encontraste algo para corregir en este flujo (texto y/o captura desactualizada),
                  creá el issue y commiteá YA — antes de pasar al siguiente flujo (ver sección de abajo).
                  No acumules varios flujos para commitear todos juntos al final: cada flujo se cierra
                  (con o sin cambios) antes de arrancar el próximo, así el trabajo ya hecho queda guardado
                  aunque te quedes sin turnos a mitad de la página.
            3. No toques nunca código de `./appcarc-mobile` ni de `./appcarc-backend` fuera de la única
               página de manual asignada.

            ## Por cada flujo en el que encontrás y arreglás algo

            1. Creá el issue ANTES de commitear (para poder referenciarlo en el commit):
               ```
               gh issue create --repo ${{ github.repository }} \
                 --title "[manual/${{ needs.select-scope.outputs.scope_name }}] <resumen corto>" \
                 --label manual-review \
                 --body "<qué estaba desactualizado, qué cambiaste, y si alguna captura quedó vieja>"
               ```
            2. Aplicá el fix de texto con Edit.
            3. Commiteá y pusheá SOLO el archivo de esa página del manual, desde `./appcarc-backend`:
               ```
               cd appcarc-backend
               git config user.name "claude-manual-bot"
               git config user.email "actions@github.com"
               git add mkdocs-manual/docs/<archivo>.md
               git commit -m "docs(manual): actualizar <página> — <resumen corto>

               Closes #<número del issue>"
               git push
               ```
            4. Recién ahí pasá al siguiente flujo.

            ## Si un flujo ya está al día

            No crees ningún issue ni hagas ningún commit para ese flujo — pasá directo al siguiente.

            ## Si la página entera ya está al día

            No crees ningún issue, no hagas ningún commit. Terminá ahí.

            No hace falta cubrir toda la página en una sola pasada — si es larga, priorizá los flujos más
            claramente desactualizados. Si te quedás sin turnos, lo que ya hayas commiteado queda hecho;
            los flujos que no llegaste a mirar se revisan la próxima vez que le toque el turno a esta
            página (la rotación vuelve a pasar por todas las páginas cada pocos días).
